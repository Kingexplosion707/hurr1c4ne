name: Build hurr1c4ne IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available schemes
        run: |
          set -euo pipefail
          echo "=== Available schemes ==="
          xcodebuild -project hurr1c4ne.xcodeproj -list

      - name: Build hurr1c4ne
        run: |
          set -euo pipefail

          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          echo "=== Build directory contents ==="
          find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null || echo "No .app found in derived data"
          echo "=== Full products directory ==="
          ls -R build/DerivedData/Build/Products/ 2>/dev/null | head -40 || echo "Products directory not found"

      - name: Locate built app
        id: locate
        run: |
          set -euo pipefail

          # Find the .app bundle wherever xcodebuild put it
          APP_PATH=$(find build/DerivedData/Build/Products -name "hurr1c4ne.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Built app not found anywhere in build/DerivedData"
            echo "=== Searching entire build directory ==="
            find build -name "*.app" -type d 2>/dev/null || echo "No .app found at all"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify app configuration
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.locate.outputs.app_path }}"
          PLIST="$APP_PATH/Info.plist"

          test -f "$PLIST" || {
            echo "::error::Built Info.plist not found at $PLIST"
            exit 1
          }

          echo "=== Bundle identifier ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"

          echo "=== Launch storyboard ==="
          LAUNCH_SCREEN=$(/usr/libexec/PlistBuddy \
            -c "Print :UILaunchStoryboardName" "$PLIST" 2>/dev/null || echo "")

          if [ -n "$LAUNCH_SCREEN" ]; then
            echo "Configured launch screen: $LAUNCH_SCREEN"
            if [ ! -f "$APP_PATH/$LAUNCH_SCREEN.storyboardc/Info.plist" ]; then
              echo "::warning::Compiled launch storyboard is missing: $LAUNCH_SCREEN.storyboardc (continuing anyway)"
              echo "=== App contents ==="
              find "$APP_PATH" -maxdepth 3 -print
            else
              echo "Launch screen verified"
            fi
          else
            echo "::warning::No launch storyboard configured (continuing anyway)"
          fi

          echo "=== Full-screen setting ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIRequiresFullScreen" "$PLIST" 2>/dev/null || echo "(not set)"

          echo "=== Device family ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIDeviceFamily" "$PLIST" 2>/dev/null || echo "(not set)"

          echo "=== Supported orientations ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || echo "(not set)"

          echo "=== Verification complete ==="

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.locate.outputs.app_path }}"
          IPA_DIR="$PWD/build/ipa"
          IPA_PATH="$PWD/build/hurr1c4ne.ipa"

          test -d "$APP_PATH"

          mkdir -p "$IPA_DIR/Payload" "$PWD/build"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$IPA_PATH"

          echo "=== Verify packaged IPA ==="
          /usr/bin/unzip -Z1 "$IPA_PATH" \
            | grep -q '^Payload/hurr1c4ne.app/Info.plist$'

          echo "IPA packaged and verified successfully."
          ls -lh "$IPA_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-ipa
          path: build/hurr1c4ne.ipa
          if-no-files-found: error
          retention-days: 14