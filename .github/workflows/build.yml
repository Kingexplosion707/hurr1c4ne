name: Build hurr1c4ne IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build hurr1c4ne
        run: |
          set -euo pipefail

          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          IPA_DIR="build/ipa"
          IPA_PATH="build/hurr1c4ne.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found at $APP_PATH"
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload" build
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$IPA_DIR/Payload" "$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA packaging failed"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-ipa
          path: build/hurr1c4ne.ipa
          if-no-files-found: error
          retention-days: 14
