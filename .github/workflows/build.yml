name: Build hurr1c4ne IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build hurr1c4ne
        run: |
          set -euo pipefail

          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app configuration
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          PLIST="$APP_PATH/Info.plist"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found"
            exit 1
          fi

          if [ ! -f "$PLIST" ]; then
            echo "::error::Built Info.plist not found"
            exit 1
          fi

          echo "=== App identity ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$PLIST"

          echo "=== Launch screen ==="
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" || true

          echo "=== Full-screen setting ==="
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$PLIST" || true

          echo "=== Supported orientations ==="
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST" || true

          echo "=== Device family ==="
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$PLIST" || true

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          IPA_DIR="$PWD/build/ipa"
          IPA_PATH="$PWD/build/hurr1c4ne.ipa"

          test -d "$APP_PATH"

          mkdir -p "$IPA_DIR/Payload" "$PWD/build"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$IPA_PATH"

          echo "=== IPA contents ==="
          /usr/bin/unzip -l "$IPA_PATH"

          /usr/bin/unzip -Z1 "$IPA_PATH" | grep -q '^Payload/hurr1c4ne.app/Info.plist$'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-ipa
          path: build/hurr1c4ne.ipa
          if-no-files-found: error
          retention-days: 14
