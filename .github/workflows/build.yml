name: Build hurr1c4ne IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Build hurr1c4ne
        run: ./build.sh

      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA_PATH="build/hurr1c4ne.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA was not created at $IPA_PATH"
            exit 1
          fi

          unzip -l "$IPA_PATH"
          echo "IPA successfully packaged."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-ipa
          path: build/hurr1c4ne.ipa
          if-no-files-found: error
          retention-days: 14
