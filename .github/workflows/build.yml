name: Build hurr1c4ne IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build hurr1c4ne
        run: |
          set -euo pipefail

          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app configuration
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH" || {
            echo "::error::Built app not found"
            exit 1
          }

          test -f "$PLIST" || {
            echo "::error::Built Info.plist not found"
            exit 1
          }

          echo "=== Bundle identifier ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"

          echo "=== Launch storyboard ==="
          LAUNCH_SCREEN=$(/usr/libexec/PlistBuddy \
            -c "Print :UILaunchStoryboardName" "$PLIST")

          echo "Configured launch screen: $LAUNCH_SCREEN"

          test -f "$APP_PATH/$LAUNCH_SCREEN.storyboardc/Info.plist" || {
            echo "::error::Compiled launch storyboard is missing: $LAUNCH_SCREEN.storyboardc"
            echo "=== App contents ==="
            find "$APP_PATH" -maxdepth 3 -print
            exit 1
          }

          echo "=== Full-screen setting ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIRequiresFullScreen" "$PLIST"

          echo "=== Device family ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIDeviceFamily" "$PLIST"

          echo "=== Supported orientations ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UISupportedInterfaceOrientations" "$PLIST"

          echo "=== Launch screen verified ==="

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          IPA_DIR="$PWD/build/ipa"
          IPA_PATH="$PWD/build/hurr1c4ne.ipa"

          test -d "$APP_PATH"

          mkdir -p "$IPA_DIR/Payload" "$PWD/build"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$IPA_PATH"

          echo "=== Verify packaged IPA ==="
          /usr/bin/unzip -Z1 "$IPA_PATH" \
            | grep -q '^Payload/hurr1c4ne.app/Info.plist$'

          /usr/bin/unzip -Z1 "$IPA_PATH" \
            | grep -q '^Payload/hurr1c4ne.app/LaunchScreen.storyboardc/'

          echo "IPA packaged and verified successfully."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-ipa
          path: build/hurr1c4ne.ipa
          if-no-files-found: error
          retention-days: 14
